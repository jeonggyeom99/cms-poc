<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>CMS 설비 알람 현황</title>
	<!-- cms:assets -->
	<link rel="stylesheet" href="/static/equipment-status2.css?v=task4">
	<script src="/static/equipment-status-demo/equipment-status-excel-data.js"></script>
	<script src="/static/equipment-status-demo/equipment-status-tree-data.js"></script>
</head>
<body <!-- cms:body-attributes -->>
	<div class="shell">
		<!-- cms:sidebar -->
		<main>
			<header class="top"><div><div class="eyebrow"></div><h1>설비 알람 현황</h1></div></header>
			<div class="equipment-status-content">
				<section class="equipment-status2-panel" aria-labelledby="equipment-status-chart-title">
					<div class="equipment-status2-head"><h2 id="equipment-status-chart-title">CMS 연결 설비 현황</h2><span id="equipment-status-chart-status" role="status">상태를 불러오는 중입니다.</span></div>
					<div class="equipment-status2-chart-grid" id="equipment-status-charts" aria-busy="true"></div>
				</section>
				<section class="equipment-status-search" aria-label="설비 조회 조건">
					<label>공장<select id="equipment-status-factory" disabled><option value="all">전체</option></select></label>
					<label>공정<select id="equipment-status-process" disabled><option value="all">전체</option></select></label>
					<label>설비유형<select id="equipment-status-type" disabled><option value="all">전체</option></select></label>
					<label>설비상태<select id="equipment-status-state" disabled><option value="all">전체</option><option value="normal">정상</option><option value="attention">주의</option><option value="critical">심각</option><option value="unknown">판단 불가</option></select></label>
					<label class="equipment-status-search__name">설비명<input id="equipment-status-name" placeholder="설비명 입력" disabled></label>
					<button id="equipment-status-reset" type="button" disabled>조건 초기화</button>
				</section>
				<p id="equipment-status-notice" class="equipment-status-notice" role="status" hidden></p>
				<section class="equipment-status-panel" aria-labelledby="equipment-status-list-title">
					<div class="equipment-status-panel__head"><h2 id="equipment-status-list-title">설비 목록</h2><span id="equipment-status-count" data-cms-result-count role="status" aria-live="polite" aria-atomic="true">조회 중</span></div>
					<div class="equipment-status-panel__body">
						<nav class="equipment-status-tree" id="equipment-status-tree" aria-label="설비 분류"></nav>
						<div class="equipment-status-list" id="equipment-status-list" aria-label="조회된 설비" aria-busy="true"><p class="equipment-status-empty">설비 목록을 불러오는 중입니다.</p></div>
					</div>
				</section>
			</div>
		</main>
	</div>
	<script type="module" src="/static/modules/equipment-status/controller.js?v=task4"></script>
	<script type="module" src="/static/modules/equipment-status/equipment-status2.js?v=task4"></script>
	<!-- cms:scripts -->
</body>
</html>
