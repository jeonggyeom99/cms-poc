<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Excel 진단 이력과 CSV 기반 설비 상태를 조회합니다.">
    <title>설비 현황 | 설비 진단</title>
    <link rel="stylesheet" href="/static/equipment-status.css?v=topbar-layout-v3">
    <script src="/static/equipment-status-demo/equipment-status-excel-data.js"></script>
    <script src="/static/equipment-status-demo/equipment-status-tree-data.js"></script>
    <script type="module" src="/static/modules/equipment-status/controller.js?v=factory-filter-v2"></script>
  </head>
  <body>
    <div class="equipment-status-page">
      <header class="equipment-status-topbar">
        <a class="equipment-status-brand" href="/" aria-label="설비 현황 홈">
          <span class="equipment-status-brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>
            <small>설비 진단 시스템</small>
            <strong>설비 모니터링</strong>
          </span>
        </a>
        <nav class="equipment-status-topbar__actions" aria-label="주요 메뉴">
          <a class="equipment-status-home-link" href="/" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3z" /></svg>
            <span>설비 현황</span>
          </a>
          <a class="equipment-status-history-link" href="/history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2" /></svg>
            <span>과거 이력</span>
          </a>
        </nav>
      </header>

      <main class="equipment-status-content">
        <section class="equipment-status-heading" aria-labelledby="equipment-status-title">
          <div>
            <span class="equipment-status-kicker">설비 현황</span>
            <h1 id="equipment-status-title">설비 모니터링</h1>
          </div>
          <time id="equipment-status-data-basis">진단 이력 기준</time>
        </section>

        <section class="equipment-status-search" aria-label="설비 상태 필터">
          <label for="equipment-status-factory">
            공장
            <select id="equipment-status-factory">
              <option value="all">전체</option>
            </select>
          </label>
          <label for="equipment-status-process">
            공정
            <select id="equipment-status-process">
              <option value="all">전체</option>
            </select>
          </label>
          <label for="equipment-status-type">
            설비유형
            <select id="equipment-status-type">
              <option value="all">전체</option>
            </select>
          </label>
          <label for="equipment-status-state">
            설비상태
            <select id="equipment-status-state">
              <option value="all">전체</option>
              <option value="normal">정상</option>
              <option value="attention">주의</option>
              <option value="critical">심각</option>
              <option value="unknown">판단 불가</option>
            </select>
          </label>
          <label class="equipment-status-search__name" for="equipment-status-name">
            설비명
            <input id="equipment-status-name" type="search" placeholder="설비명 입력" autocomplete="off">
          </label>
          <button id="equipment-status-reset" type="button">조건 초기화</button>
        </section>

        <p class="equipment-status-notice" id="equipment-status-notice" role="status" hidden></p>

        <section class="equipment-status-panel" aria-labelledby="equipment-status-list-title">
          <div class="equipment-status-panel__head">
            <div>
              <span class="equipment-status-kicker">진단 이력</span>
              <h2 id="equipment-status-list-title">설비 목록</h2>
            </div>
            <span id="equipment-status-count" aria-live="polite">설비 목록을 불러오는 중...</span>
          </div>
          <div class="equipment-status-panel__body">
            <aside class="equipment-status-tree" id="equipment-status-tree" aria-label="설비 분류 트리"></aside>
            <div class="equipment-status-list" id="equipment-status-list" role="list" aria-labelledby="equipment-status-list-title" aria-busy="true">
              <p class="equipment-status-empty">설비 목록을 불러오는 중입니다.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
