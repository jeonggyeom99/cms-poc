<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Excel 진단 이력과 CSV 기반 설비 상태를 조회합니다.">
    <title>설비 현황 | CMS AI Dashboard</title>
    <link rel="stylesheet" href="/static/equipment-status.css?v=equipment-status-landing">
    <script type="module" src="/static/modules/equipment-status/controller.js?v=equipment-status-landing"></script>
  </head>
  <body>
    <div class="equipment-status-page">
      <header class="equipment-status-topbar">
        <a class="equipment-status-brand" href="/" aria-label="설비 현황 홈">
          <span class="equipment-status-brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>
            <small>ALARM COPILOT</small>
            <strong>설비 상태 조회</strong>
          </span>
        </a>
        <div class="equipment-status-topbar__actions">
          <a class="equipment-status-history-link" href="/history">과거 이력</a>
          <span class="equipment-status-live"><b aria-hidden="true"></b>LIVE MONITORING</span>
        </div>
      </header>

      <main class="equipment-status-content">
        <section class="equipment-status-heading" aria-labelledby="equipment-status-title">
          <div>
            <span class="equipment-status-kicker">EQUIPMENT STATUS</span>
            <h1 id="equipment-status-title">설비 현황</h1>
          </div>
          <time id="equipment-status-data-basis">Excel 진단 이력 기준</time>
        </section>

        <section class="equipment-status-search" aria-label="설비 상태 필터">
          <label for="equipment-status-process">
            공장
            <select id="equipment-status-process">
              <option value="all">전체</option>
            </select>
          </label>
          <label for="equipment-status-state">
            설비상태
            <select id="equipment-status-state">
              <option value="all">전체</option>
              <option value="normal">정상</option>
              <option value="attention">주의</option>
              <option value="critical">심각</option>
              <option value="unknown">판단 불가</option>
            </select>
          </label>
          <button id="equipment-status-reset" type="button">조건 초기화</button>
        </section>

        <p class="equipment-status-notice" id="equipment-status-notice" role="status" hidden></p>

        <section class="equipment-status-panel" aria-labelledby="equipment-status-list-title">
          <div class="equipment-status-panel__head">
            <div>
              <span class="equipment-status-kicker">EXCEL DIAGNOSTIC HISTORY</span>
              <h2 id="equipment-status-list-title">설비 목록</h2>
            </div>
            <span id="equipment-status-count" aria-live="polite">설비 목록을 불러오는 중...</span>
          </div>
          <div class="equipment-status-list" id="equipment-status-list" role="list" aria-labelledby="equipment-status-list-title" aria-busy="true">
            <p class="equipment-status-empty">설비 목록을 불러오는 중입니다.</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
