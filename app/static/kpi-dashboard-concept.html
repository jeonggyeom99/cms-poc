<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMS 설비 운영 현황</title>
  <!-- cms:assets -->
  <link rel="stylesheet" href="/static/kpi-dashboard-concept.css">
  <link rel="stylesheet" href="/static/dashboard-chart-panels.css">
</head>
<body <!-- cms:body-attributes -->>
  <div class="shell">
    <!-- cms:sidebar -->
    <main class="overview-main" aria-busy="true">
      <header class="top"><div><div class="eyebrow"></div><h1>오늘의 설비 운영 현황</h1></div><nav class="actions" aria-label="대시보드 비교"><a class="btn" href="/dashboard_ui1">KPI 1</a><a class="btn primary" href="/dashboard_ui2">KPI 2</a></nav></header>
      <p id="dashboard-status" role="status">설비 데이터를 불러오는 중입니다.</p>
      <section class="grid" aria-label="주요 설비 지표">
        <article class="kpi"><div class="kpi-top"><span>전체 설비</span><span class="kpi-icon i-blue" aria-hidden="true"></span></div><strong>-</strong><span class="delta"></span></article>
        <article class="kpi"><div class="kpi-top"><span>정상 설비</span><span class="kpi-icon i-mint" aria-hidden="true"></span></div><strong>-</strong><span class="delta"></span></article>
        <article class="kpi"><div class="kpi-top"><span>주의 설비</span><span class="kpi-icon i-orange" aria-hidden="true"></span></div><strong>-</strong><span class="delta"></span></article>
        <article class="kpi"><div class="kpi-top"><span>심각 설비</span><span class="kpi-icon i-red" aria-hidden="true"></span></div><strong>-</strong><span class="delta"></span></article>
      </section>
      <section class="hero" aria-label="위험 설비 및 진단 이력">
        <div class="hero-card"><div class="eyebrow"></div><h2>설비 상태 조회 중</h2><p></p><div class="hero-metric"><div><strong>-</strong><small>정상 설비 비율</small></div><div><strong>-</strong><small>주의 이상 설비</small></div></div></div>
        <div class="snapshot"><div class="snapshot-head"><div><h3>최근 진단 활동</h3><span class="empty">최근 진단 건수</span></div><span class="tag">-</span></div><div class="spark"></div><div class="snapshot-days"></div></div>
      </section>
      <section class="columns" aria-label="공장별 상태 추세">
        <article class="panel"><div class="panel-head"><h3>공장별 설비 상태</h3><span>정상 · 주의 이상</span></div><div class="bars"></div><div class="legend"><span><i class="dot"></i>정상</span><span><i class="dot dark"></i>주의 이상</span></div></article>
        <article class="panel"><div class="panel-head"><h3>설비 상태 구성</h3><span>전체 설비 기준</span></div><div class="health"><div class="donut" data-label="-"></div><div class="health-list"><div class="health-row"><span>정상</span><b>-</b></div><div class="health-row"><span>주의</span><b>-</b></div><div class="health-row"><span>심각 이상</span><b>-</b></div></div></div></article>
      </section>
      <section class="panel table" aria-label="점검 우선순위 설비"><div class="panel-head"><h3>점검 우선순위 설비</h3><span></span></div><table><thead><tr><th>설비</th><th>공장 · 공정</th><th>최근 진단</th><th>측정 포인트</th><th>상태</th></tr></thead><tbody><tr><td colspan="5">설비 데이터를 불러오는 중입니다.</td></tr></tbody></table></section>
      <div class="footnote"></div>
    </main>
  </div>
  <script type="module" src="/static/modules/main/kpi-concept.js?v=demo-unbalance-v1"></script>
  <script type="module" src="/static/modules/main/dashboard-chart-panels.js?v=20261008"></script>
  <!-- cms:scripts -->
</body>
</html>
