[project]
name = "cms-ai-poc"
version = "0.1.0"
description = "FastAPI-based local CMS AI dashboard proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "fastapi>=0.116,<1",
    "openai>=1,<2",
    "pillow>=10,<14",
    "python-pptx>=1,<2",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
